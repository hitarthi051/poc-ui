version: 0.2
phases:
  install:
    commands:
       - echo "Installing dependencies"
       - npm i -f
  build:
    commands:
      - echo "Building the application"
      - npm run build
  post_build:
    commands:
      - echo "Uploading files to S3"
      - aws s3 cp ./build s3://$UIARTIFACTBUCKETNAME/ --recursive
      - zip -r build.zip build
      - aws s3 cp ./build.zip s3://$UIARTIFACTBUCKETNAME/ --recursive
artifacts:
  # files:
  #    - build.zip
  # name: "zero-downtime-poc-ui.zip"

  base-directory: build 
  files:
    - '**/*'
  name: "zero-downtime-poc-ui"
